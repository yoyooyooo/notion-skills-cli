name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        node: [22.23.5, 24.22.3, 26.13.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Check macOS retention capability
        if: runner.os == 'macOS'
        run: |
          test -x /usr/bin/trash
          mkdir -p "$HOME/.Trash"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Pack and test a fresh consumer
        env:
          NTN_SMOKE_EVIDENCE_ROOT: ${{ runner.temp }}/ntn-consumer-evidence
        run: bun scripts/package-check.ts > "$RUNNER_TEMP/ntn-package-check.json"
      - name: Upload consumer verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/ntn-package-check.json
            ${{ runner.temp }}/ntn-consumer-evidence/**/report.json
            ${{ runner.temp }}/ntn-consumer-evidence/**/*requests*.jsonl
            !${{ runner.temp }}/ntn-consumer-evidence/**/node_modules/**
          if-no-files-found: ignore
          retention-days: 7
