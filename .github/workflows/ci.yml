name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Pack and test a fresh consumer
        run: bun run package:check > "$RUNNER_TEMP/package-check.json"
      - name: Keep the build runtime
        shell: bash
        run: |
          cp "$(command -v bun)" "$RUNNER_TEMP/build-bun"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Minimum Bun offline consumer
        shell: bash
        run: |
          archive="$("$RUNNER_TEMP/build-bun" -e 'const p=await Bun.file(process.argv[1]).json(); process.stdout.write(p.archive)' "$RUNNER_TEMP/package-check.json")"
          "$RUNNER_TEMP/build-bun" scripts/package-smoke.ts --archive "$archive" --runtime "$(command -v bun)"
