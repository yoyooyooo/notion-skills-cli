name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        node: [22.22.3, 24.20.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Check macOS retention capability
        if: runner.os == 'macOS'
        run: |
          test -x /usr/bin/trash
          mkdir -p "$HOME/.Trash"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Pack and test a fresh consumer
        run: bun scripts/package-check.ts > "$RUNNER_TEMP/ntn-package-check.json"
      - name: Upload consumer verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/ntn-package-check.json
          if-no-files-found: ignore
          retention-days: 7
